name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql, json, zip, gd
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check release version consistency
        run: php bin/check_version.php

      - name: Smoke test lightweight helpers
        run: php bin/check_lightweight_helpers.php

      - name: Smoke test API routes
        run: php bin/check_api_routes.php

      - name: Smoke test HTMX security defaults
        run: php bin/check_htmx_security.php

      - name: Smoke test frontend security guards
        run: php bin/check_frontend_security.php

      - name: Check generated Hook docs
        shell: bash
        run: |
          php bin/generate_hook_docs.php
          git diff --exit-code -- docs/hooks.md

      - name: Check generated XiunoPHP bundle
        shell: bash
        run: |
          (cd tool && php merge.php)
          git diff --exit-code -- xiunophp/xiunophp.min.php

      - name: Smoke test CLI commands
        shell: bash
        run: |
          php bin/xiuno list
          php bin/xiuno help make:plugin
          php bin/xiuno help migrate
          php bin/xiuno help upgrade
          php bin/xiuno migrate --check
          php bin/xiuno upgrade --check

      - name: Smoke test plugin scaffold
        shell: bash
        run: |
          rm -rf plugin/smoke_plugin
          php bin/xiuno make:plugin smoke_plugin
          test -f plugin/smoke_plugin/conf.json
          test -f plugin/smoke_plugin/hook/index_inc_start.php
          test -f plugin/smoke_plugin/install.php
          test -f plugin/smoke_plugin/unstall.php
          test -f plugin/smoke_plugin/upgrade.php
          rm -rf plugin/smoke_plugin

      - name: Lint core PHP files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/dev/null; then
              failed=1
            fi
          done < <(find . \
            -path './.git' -prune -o \
            -path './plugin' -prune -o \
            -path './vendor' -prune -o \
            -name '*.php' -print0)
          exit "$failed"

  mysql-schema:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: xiuno_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Smoke test install schema
        env:
          XIUNO_DB_HOST: 127.0.0.1
          XIUNO_DB_PORT: 3306
          XIUNO_DB_NAME: xiuno_test
          XIUNO_DB_USER: root
          XIUNO_DB_PASSWORD: root
        run: php bin/check_install_schema.php
