name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, openssl, pdo, pdo_mysql, pdo_sqlite, mbstring, gd, zip
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run deterministic check suite
        run: php bin/run_checks.php --profile=deterministic --fail-on-skip

      - name: Run BS4 compatibility behavior fixture in Chromium
        if: matrix.php-version == '8.2'
        run: php bin/run_checks.php --profile=browser --fail-on-skip

      - name: Check generated XiunoPHP bundle
        shell: bash
        run: |
          (cd tool && php merge.php)
          git diff --exit-code -- xiunophp/xiunophp.php xiunophp/xiunophp.min.php

      - name: Smoke test CLI commands
        shell: bash
        run: |
          php bin/xiuno list
          php bin/xiuno help make:plugin
          php bin/xiuno help migrate
          php bin/xiuno help upgrade
          php bin/xiuno migrate --check
          php bin/xiuno upgrade --check

      - name: Lint core PHP files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/dev/null; then
              failed=1
            fi
          done < <(find . \
            -path './.git' -prune -o \
            -path './plugin' -prune -o \
            -path './vendor' -prune -o \
            -name '*.php' -print0)
          exit "$failed"

  mysql-schema:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql-version: ['8.0', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: xiuno_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, openssl, pdo, pdo_mysql, mbstring, gd, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run database smoke profile
        env:
          XIUNO_DB_HOST: 127.0.0.1
          XIUNO_DB_PORT: 3306
          XIUNO_DB_NAME: xiuno_test
          XIUNO_DB_USER: root
          XIUNO_DB_PASSWORD: root
          XIUNO_EXPECT_MYSQL_MAJOR: 8
          XIUNO_ALLOW_DESTRUCTIVE_SMOKE: 1
        run: php bin/run_checks.php --profile=db --fail-on-skip

      - name: Run database smoke profile under strict SQL mode
        env:
          XIUNO_DB_HOST: 127.0.0.1
          XIUNO_DB_PORT: 3306
          XIUNO_DB_NAME: xiuno_test_strict
          XIUNO_DB_USER: root
          XIUNO_DB_PASSWORD: root
          XIUNO_EXPECT_MYSQL_MAJOR: 8
          XIUNO_SQL_MODE: STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,ONLY_FULL_GROUP_BY,NO_ENGINE_SUBSTITUTION
          XIUNO_ALLOW_DESTRUCTIVE_SMOKE: 1
        run: php bin/run_checks.php --profile=db --fail-on-skip

  docker-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, openssl, pdo, pdo_mysql, mbstring, gd, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Smoke test Docker Nginx and HTTP workflows
        run: php bin/run_checks.php --profile=docker --fail-on-skip
