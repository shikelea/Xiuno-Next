name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql, json, zip, gd
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check release version consistency
        run: php bin/check_version.php

      - name: Lint core PHP files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/dev/null; then
              failed=1
            fi
          done < <(find . \
            -path './.git' -prune -o \
            -path './plugin' -prune -o \
            -path './vendor' -prune -o \
            -name '*.php' -print0)
          exit "$failed"
