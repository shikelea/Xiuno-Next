name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql, json, zip, gd
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check release version consistency
        run: php bin/check_version.php

      - name: Smoke test lightweight helpers
        run: php bin/check_lightweight_helpers.php

      - name: Smoke test API routes
        run: php bin/check_api_routes.php

      - name: Smoke test HTMX security defaults
        run: php bin/check_htmx_security.php

      - name: Smoke test frontend security guards
        run: php bin/check_frontend_security.php

      - name: Smoke test BS4 compatibility layer
        run: php bin/check_bs4_compat_layer.php

      - name: Smoke test theme API safety
        run: php bin/check_theme_api_safety.php

      - name: Smoke test theme overwrite compilation
        run: php bin/check_plugin_theme_overwrite_compile_smoke.php

      - name: Smoke test hook context compilation
        run: php bin/check_plugin_hook_context_compile_smoke.php

      - name: Smoke test admin config safety
        run: php bin/check_admin_config_safety.php

      - name: Smoke test admin user safety
        run: php bin/check_admin_user_safety.php

      - name: Smoke test admin list delete safety
        run: php bin/check_admin_list_delete_safety.php

      - name: Smoke test admin thread queue safety
        run: php bin/check_admin_thread_queue_safety.php

      - name: Smoke test admin auth safety
        run: php bin/check_admin_auth_safety.php

      - name: Smoke test user auth safety
        run: php bin/check_user_auth_safety.php

      - name: Smoke test plugin task safety
        run: php bin/check_plugin_task_safety.php

      - name: Smoke test plugin dependency status
        run: php bin/check_plugin_dependency_status.php

      - name: Smoke test plugin dependency flow
        run: php bin/check_plugin_dependency_flow_smoke.php

      - name: Smoke test ecosystem dependency families
        run: php bin/check_ecosystem_dependency_family_smoke.php

      - name: Smoke test same-type dependency rollback
        run: php bin/check_plugin_same_type_dependency_smoke.php

      - name: Smoke test plugin PHP syntax guard
        run: php bin/check_plugin_syntax_guard.php

      - name: Smoke test plugin lifecycle safety
        run: php bin/check_plugin_lifecycle_safety.php

      - name: Smoke test plugin lifecycle exit rollback
        run: php bin/check_plugin_lifecycle_exit_smoke.php

      - name: Smoke test plugin upgrade lifecycle rollback
        run: php bin/check_plugin_upgrade_lifecycle_smoke.php

      - name: Smoke test plugin package rollback
        run: php bin/check_plugin_package_rollback.php

      - name: Smoke test update task safety
        run: php bin/check_update_task_safety.php

      - name: Smoke test install safety
        run: php bin/check_install_safety.php

      - name: Smoke test CLI and upgrade safety
        run: php bin/check_cli_upgrade_safety.php

      - name: Check MySQL 8 SQL compatibility
        run: php bin/check_mysql8_compat.php

      - name: Smoke test route method safety
        run: php bin/check_route_method_safety.php

      - name: Check generated frontend assets
        run: php bin/build_frontend_assets.php --check

      - name: Check generated Hook docs
        shell: bash
        run: |
          php bin/generate_hook_docs.php
          git diff --exit-code -- docs/hooks.md

      - name: Check generated XiunoPHP bundle
        shell: bash
        run: |
          (cd tool && php merge.php)
          git diff --exit-code -- xiunophp/xiunophp.min.php

      - name: Smoke test CLI commands
        shell: bash
        run: |
          php bin/xiuno list
          php bin/xiuno help make:plugin
          php bin/xiuno help migrate
          php bin/xiuno help upgrade
          php bin/xiuno migrate --check
          php bin/xiuno upgrade --check

      - name: Smoke test plugin scaffold
        shell: bash
        run: |
          rm -rf plugin/smoke_plugin
          php bin/xiuno make:plugin smoke_plugin
          test -f plugin/smoke_plugin/conf.json
          test -f plugin/smoke_plugin/hook/index_inc_start.php
          test -f plugin/smoke_plugin/install.php
          test -f plugin/smoke_plugin/unstall.php
          test -f plugin/smoke_plugin/upgrade.php
          rm -rf plugin/smoke_plugin

      - name: Lint core PHP files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/dev/null; then
              failed=1
            fi
          done < <(find . \
            -path './.git' -prune -o \
            -path './plugin' -prune -o \
            -path './vendor' -prune -o \
            -name '*.php' -print0)
          exit "$failed"

  mysql-schema:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: xiuno_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Smoke test install schema
        env:
          XIUNO_DB_HOST: 127.0.0.1
          XIUNO_DB_PORT: 3306
          XIUNO_DB_NAME: xiuno_test
          XIUNO_DB_USER: root
          XIUNO_DB_PASSWORD: root
          XIUNO_EXPECT_MYSQL_MAJOR: 8
        run: php bin/check_install_schema.php

      - name: Smoke test old-version upgrade and migrations
        env:
          XIUNO_DB_HOST: 127.0.0.1
          XIUNO_DB_PORT: 3306
          XIUNO_DB_NAME: xiuno_test
          XIUNO_DB_USER: root
          XIUNO_DB_PASSWORD: root
          XIUNO_ALLOW_DESTRUCTIVE_SMOKE: 1
        run: php bin/check_legacy_upgrade_smoke.php

      - name: Smoke test plugin install SQL samples
        env:
          XIUNO_DB_HOST: 127.0.0.1
          XIUNO_DB_PORT: 3306
          XIUNO_DB_NAME: xiuno_test
          XIUNO_DB_USER: root
          XIUNO_DB_PASSWORD: root
          XIUNO_ALLOW_DESTRUCTIVE_SMOKE: 1
        run: php bin/check_plugin_install_sql_smoke.php
