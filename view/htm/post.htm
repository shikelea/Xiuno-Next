<script>
var jform = $('#form');
var jsubmit = $('#submit');
var jfid = jform.find('select[name="fid"]');
var attach_upload_busy = false;
var attach_upload_wait_message = <?php echo xn_json_encode_for_script(lang('attach_upload_in_progress'));?>;
jform.on('submit', function() {
	if (attach_upload_busy) {
		$.alert(attach_upload_wait_message);
		return false;
	}
	jform.reset();
	jsubmit.button('loading');
	var postdata = jform.serialize();
	$.xpost(jform.attr('action'), postdata, function(code, message) {
		if(code == 0) {
			$.alert(message);
			var redirect_url = <?php echo xn_json_encode_for_script($location);?>;
			redirect_url = redirect_url.replace('__FID__', jfid.checked());
			jsubmit.button(message).delay(1000).location(redirect_url);
		} else if(xn.is_number(code)) {
			alert(message);
			jsubmit.button('reset');
		} else {
			var jfield = jform.find(':input').filter(function() { return this.name == code; }).first();
			jfield.length ? jfield.alert(message).focus() : $.alert(message);
			jsubmit.button('reset');
		}
	});
	return false;
});

var jattachparent = $('.attachlist_parent');
var jattachinput = $('#addattach input[type="file"]');
var attach_draft = <?php echo xn_json_encode_for_script($attach_draft);?>;
function attach_upload_set_busy(busy) {
	attach_upload_busy = !!busy;
	jattachinput.prop('disabled', attach_upload_busy);
	jsubmit.prop('disabled', attach_upload_busy);
}
jattachinput.on('change', function(e) {
	var files = xn.get_files_from_event(e);
	if (!files || !files.length) return;
	var selected_files = [];
	for (var file_index = 0; file_index < files.length; file_index++) selected_files.push(files[file_index]);
	files = selected_files;
	// File inputs do not emit change when the same file remains selected. Clear only after
	// copying the File objects so a failed upload can be selected again immediately.
	jattachinput.val('');
	if (attach_upload_busy) return;
	attach_upload_set_busy(true);
	
	// 并发下会 服务端 session 写入会有问题，由客户端控制改为串行
	if (!jattachparent.find('.attachlist').length) {
		var juploaded = $('<fieldset>').addClass('fieldset');
		$('<legend>').text(<?php echo xn_json_encode_for_script(lang('uploaded_attach'));?>).appendTo(juploaded);
		$('<ul>').addClass('attachlist').appendTo(juploaded);
		jattachparent.append(juploaded);
	}
	
	var jprogress = jattachparent.find('.progress');
	if(!jprogress.length) {
		jprogress = $('<div class="progress"><div class="progress-bar" role="progressbar" style="width: 25%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">25%</div></div>').appendTo(jattachparent);
	}
	var jprogressbar = jprogress.find('.progress-bar');

	$.each_sync(files, function(i, callback) {
		var file = files[i];
		xn.upload_file(file, xn.url('attach-create'), {is_image: 0, attach_draft: attach_draft}, function(code, message) {
			if (code != 0) {
				$.alert(message);
				callback();
				return;
			}
			// 把文件 append 到附件列表
			var url = message.url;
			var filetype = String(message.filetype || '').replace(/[^\w-]/g, '');
			var aid = String(message.aid || '');
			var orgfilename = String(message.orgfilename || '');
			var jli = $('<li>').attr('aid', aid);
			var jfile = $('<a>').attr({
				href: url,
				target: '_blank',
				rel: 'noopener noreferrer'
			});
			$('<i>').addClass('icon filetype').addClass(filetype).attr('aria-hidden', 'true').appendTo(jfile);
			jfile.append(document.createTextNode(' ' + orgfilename));
			var jdelete = $('<a>').attr('href', '#').addClass('delete ms-2');
			$('<i>').addClass('icon-remove').attr('aria-hidden', 'true').appendTo(jdelete);
			jdelete.append(document.createTextNode(' ' + <?php echo xn_json_encode_for_script(lang('delete'));?>));
			jli.append(jfile, ' ', jdelete);
			$('.attachlist').append(jli);
			callback();
		}, function(percent) {
			percent = xn.intval(percent);
			jprogressbar.css('width', percent+'%');
			jprogressbar.text(percent+'%');
			jprogress.show();
			console.log('progress:'+ percent); 
		});
	}, function() {
		jprogress.hide();
		attach_upload_set_busy(false);
	});
});

// 删除附件
jattachparent.on('click', 'a.delete', function() {
	var jlink = $(this);
	var jli = jlink.parents('li');
	var aid = jli.attr('aid');
	if(!window.confirm(lang.confirm_delete)) return false;
	$.xpost(xn.url('attach-delete-'+aid), {attach_draft: attach_draft}, function(code, message) {
		if(code != 0) return $.alert(message);
		jlink.parent().remove();
	});
	return false;
})

</script>
