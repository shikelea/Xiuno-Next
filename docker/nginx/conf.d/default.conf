server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html index.htm;

    # 字符集设置
    charset utf-8;

    # 日志设置
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 安装器必须在首次部署时可访问，但安装目录其他文件不对外提供。
    location = /install {
        return 302 /install/;
    }

    location = /install/ {
        return 302 /install/index.php;
    }

    location = /install/index.php {
        fastcgi_pass   app:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root/install/index.php;
        include        fastcgi_params;
    }

    # 禁止访问敏感配置和数据目录，防止信息泄露。
    location ~ ^/(conf|log|tmp|data|bin|database|model|route|src|tool|xiunophp)/ {
        deny all;
        return 404;
    }

    location ~ ^/install/ {
        deny all;
        return 404;
    }

    # 模板只由 PHP include，不应作为静态文件暴露源码片段。
    location ~ ^/(admin/)?view/htm/ {
        deny all;
        return 404;
    }

    location ~ ^/admin/route/ {
        deny all;
        return 404;
    }

	# 插件生命周期、设置、Hook 与 overwrite 文件只能由核心兼容层 include。
	# 未声明的旧插件公共 PHP 端点暂不一刀切，避免在缺少入口元数据时破坏兼容性。
	location ~* ^/plugin/[^/]+/(install|unstall|upgrade|setting)\.php$ {
		deny all;
		return 404;
	}

	location ~* ^/plugin/[^/]+/(hook|overwrite)/.*\.php$ {
		deny all;
		return 404;
	}

    # 上传白名单是第一层防护；Web 服务器再明确拒绝上传目录的 PHP 执行。
    location ~* ^/upload/.*\.php$ {
        deny all;
        return 404;
    }

    # 🔒 安全修复：禁止访问备份文件和编辑器临时文件，防止源码泄露
    # 常见备份文件扩展名：.bak .old .backup .save .swp .swo ~ .orig
    location ~ \.(bak|old|backup|save|swp|swo|orig)$ {
        deny all;
        return 404;
    }

    # 🔒 安全修复：添加基础安全响应头，提升浏览器防护能力
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态资源缓存
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires      30d;
    }

    location ~ .*\.(js|css)?$ {
        expires      12h;
    }

    # Xiuno 伪静态规则 (基于 index.php 接管所有未找到的请求)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # PHP 处理
    location ~ \.php$ {
        fastcgi_pass   app:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }
}
