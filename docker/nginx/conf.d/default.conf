server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html index.htm;

    # 字符集设置
    charset utf-8;

    # 日志设置
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 🔒 安全修复：禁止访问敏感配置和数据目录，防止信息泄露
    # 保护配置文件、日志文件、临时文件、数据文件、命令行工具、安装程序
    location ~ ^/(conf|log|tmp|data|bin|install)/ {
        deny all;
        return 404;
    }

    # 🔒 安全修复：禁止访问备份文件和编辑器临时文件，防止源码泄露
    # 常见备份文件扩展名：.bak .old .backup .save .swp .swo ~ .orig
    location ~ \.(bak|old|backup|save|swp|swo|orig)$ {
        deny all;
        return 404;
    }

    # 🔒 安全修复：添加基础安全响应头，提升浏览器防护能力
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态资源缓存
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires      30d;
    }

    location ~ .*\.(js|css)?$ {
        expires      12h;
    }

    # Xiuno 伪静态规则 (基于 index.php 接管所有未找到的请求)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # PHP 处理
    location ~ \.php$ {
        fastcgi_pass   app:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }
}
